global
  tune.lua.bool-sample-conversion normal
  # log /dev/log local0
  # log /dev/log local1 notice
  log stdout format raw daemon info
  lua-load /etc/haproxy/lua/auth.lua
  stats socket /var/run/haproxy/haproxy.sock level admin expose-fd listeners
  daemon

  # Mozilla Modern
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-bind-options prefer-client-ciphers no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
  ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets

defaults
  mode http
  log global
  option tcplog
  option dontlognull
  timeout connect 5s
  timeout client 50s
  timeout server 50s

frontend haproxy-tls
  mode tcp
  timeout client 1h
  bind :::443 v4v6 ssl crt /etc/letsencrypt/live/${DOMAIN_NAME}/haproxy.pem alpn h2,http/1.1
  tcp-request inspect-delay 5s
  tcp-request content accept if { req_ssl_hello_type 1 }

  # Backend rules
  use_backend reject if !{ ssl_fc_has_sni }
  use_backend reject if !{ ssl_fc_sni -i ${DOMAIN_NAME} } !{ ssl_fc_sni -m end .${DOMAIN_NAME} }
  use_backend %[lua.identify_protocol]
  default_backend nginx

backend trojan-nomux
  mode tcp
  timeout server 1h
  server trojan host.docker.internal:11222 init-addr last,libc,none check

backend trojan
  mode tcp
  timeout server 1h
  server trojan host.docker.internal:11333 init-addr last,libc,none check

backend anytls
  mode tcp
  timeout server 1h
  server anytls host.docker.internal:11444 init-addr last,libc,none check

backend nginx
  mode http
  option forwardfor
  http-reuse never
  server web nginx:36078 init-addr last,libc,none check

backend reject
  mode http
  http-request deny
