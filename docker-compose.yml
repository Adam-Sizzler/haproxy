x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - all-net

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

services:
  haproxy:
    <<: [*common, *logging, *env]
    image: ghcr.io/adam-sizzler/haproxy:latest
    container_name: haproxy
    hostname: haproxy
    ports:
      - "${HAPROXY_EXTERNAL_PORT:-443}:443"
    volumes:
      - haproxy-socket:/var/run/haproxy
      - haproxy-data:/etc/haproxy/data
      - certificate:/etc/letsencrypt:ro
      - ./haproxy/haproxy.cfg:/app/haproxy.cfg:ro
    healthcheck:
      test: ["CMD", "pidof", "haproxy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  all-net:
    name: all-net
    driver: bridge
    external: false

volumes:
  haproxy-socket:
    name: haproxy-socket
    driver: local
    external: false
  haproxy-data:
    name: haproxy-data
    driver: local
    external: false
  certificate:
    name: certificate
    driver: local
    external: false
